# Golang Samples Workflow Bulk Go Module Dependency Update

## Action

Follow the bulk-go-module-dependency-update workflow:
1. Identify outdated dependencies (often via automation, e.g., Dependabot).
2. For each affected subdirectory, update the relevant dependency versions in go.mod.
3. Run 'go mod tidy' or equivalent to update go.sum.
4. Commit all changed go.mod and go.sum files together in a single commit.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: **/go.mod, **/go.sum

